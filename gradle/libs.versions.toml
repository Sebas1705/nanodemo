# Version catalog para nanodemo. Solo se listan las versiones que el proyecto
# usa de verdad (nada copiado del template a ciegas) — cada una fue verificada
# contra Maven real antes de fijarla acá (ver historial de esta migración).

[versions]
# Gradle plugins / toolchain
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.7"
detekt = "1.23.8"
junit = "4.13.2"

# Tier A/B/C: librerías de inferencia (ya usadas y confirmadas en nanodemo)
mlkitGenaiPrompt = "1.0.0-beta4"
mediapipeTasksGenai = "0.10.35"
# tasks-text (búsqueda semántica local, TextEmbedder): paquete separado de tasks-genai, ya en 1.0.0
# estable (no en la serie 0.10.x alpha que sigue tasks-genai) — verificado en Maven directo.
mediapipeTasksText = "1.0.0"

# AndroidX core
coreKtx = "1.17.0"
activityCompose = "1.9.2"

# Compose (vía BOM, no versiones individuales)
composeBom = "2024.09.00"

# Lifecycle — 2.10.0 en todos los artefactos (alineado con lifecycle-viewmodel-navigation3,
# que solo existe estable desde 2.10.0; ver verificación contra maven-metadata.xml)
lifecycle = "2.10.0"

# Navigation 3
nav3Core = "1.0.0"
lifecycleNav3 = "2.10.0"

# Hilt (DI) + KSP (sin kapt: el proyecto usa Kotlin built-in de AGP 9, incompatible con kapt clásico)
# 2.60.1 (no 2.58): Hilt 2.58 todavía busca la extensión legacy
# com.android.build.gradle.BaseExtension (que el Kotlin built-in de AGP 9 no
# registra) y falla con "Could not find the Android Gradle Plugin (AGP) base
# extension" — verificado decompilando el plugin de ambas versiones, 2.60.1
# ya solo depende de com.android.build.api.dsl.CommonExtension.
hilt = "2.60.1"
# hiltLifecycleViewmodelCompose (no hilt-navigation-compose): ese último es
# para Navigation *2*; nanodemo usa Navigation 3 exclusivamente, y su
# integración con Hilt vive en un artefacto separado (androidx.hilt.lifecycle.
# viewmodel.compose.hiltViewModel(), verificado leyendo el .aar real).
hiltLifecycleViewmodelCompose = "1.3.0"

# kotlinx.serialization — lo exigen las rutas @Serializable de Navigation 3
# (rememberNavBackStack necesita poder guardar el backstack). Versión tomada
# del template (ya confirmada compatible con Kotlin 2.3.21).
kotlinSerializationJson = "1.9.0"

# Room — historial de conversaciones en SQLite local (data:history).
room = "2.8.5"

# Tier D: LiteRT-LM (sucesor oficial de MediaPipe LLM Inference). API verificada
# contra el .aar real de 0.17.1 (Engine/Conversation/SamplerConfig/Contents).
litertlm = "0.17.1"

# Tier E: Firebase AI Logic (acceso a Gemini vía Firebase). API verificada contra
# el .aar real de 17.17.0. Sin el plugin google-services: la app se inicializa a
# mano con FirebaseOptions desde local.properties (ver data:firebaseai).
firebaseAi = "17.17.0"

# Crashlytics (tier de observabilidad, no de IA). 20.1.1 = la del BoM 34.19.0 junto con firebase-ai 17.17.0;
# ambas dependen de firebase-common 22.0.1, que se declara aparte porque data:firebasecore usa
# FirebaseApp/FirebaseOptions directamente. Sin el plugin de Gradle de Crashlytics (ver data:crashlytics).
firebaseCrashlytics = "20.1.1"
firebaseCommon = "22.0.1"
# Analytics 23.2.0 = la del BoM 34.19.0. Necesita la resource `google_app_id` (la genera el build de :app
# desde FIREBASE_APP_ID, ver app/build.gradle.kts): NO lee FirebaseOptions, así que la inicialización
# manual de FirebaseApp por sí sola no le basta (verificado en el bytecode de play-services-measurement).
firebaseAnalytics = "23.2.0"

[libraries]
# Tiers de inferencia
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
firebase-ai = { group = "com.google.firebase", name = "firebase-ai", version.ref = "firebaseAi" }
firebase-common = { group = "com.google.firebase", name = "firebase-common", version.ref = "firebaseCommon" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "firebaseAnalytics" }
mlkit-genai-prompt ={ group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkitGenaiPrompt" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeTasksGenai" }
mediapipe-tasks-text = { group = "com.google.mediapipe", name = "tasks-text", version.ref = "mediapipeTasksText" }

# Core AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (versiones resueltas por el BOM)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Navigation 3
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3Core" }
navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3Core" }
lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleNav3" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }

# kotlinx.serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerializationJson" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Tests unitarios (JVM) de la lógica pura — ver los src/test de cada módulo.
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Gradle plugins consumidos desde build-logic/convention/build.gradle.kts
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
detekt-gradle-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# Convention plugins locales (build-logic), sin versión (resueltos por includeBuild)
buildlogic-application = { id = "buildlogic.android.application", version = "null" }
buildlogic-library = { id = "buildlogic.android.library", version = "null" }
buildlogic-core = { id = "buildlogic.android.core", version = "null" }
buildlogic-domain = { id = "buildlogic.android.domain", version = "null" }
buildlogic-data = { id = "buildlogic.android.data", version = "null" }
buildlogic-feature = { id = "buildlogic.android.feature", version = "null" }
buildlogic-hilt = { id = "buildlogic.android.hilt", version = "null" }
buildlogic-compose = { id = "buildlogic.android.compose", version = "null" }
buildlogic-material = { id = "buildlogic.android.material", version = "null" }
buildlogic-lifecycle = { id = "buildlogic.android.lifecycle", version = "null" }
buildlogic-navigation = { id = "buildlogic.android.navigation", version = "null" }
buildlogic-jacoco = { id = "buildlogic.android.jacoco", version = "null" }
buildlogic-detekt = { id = "buildlogic.android.detekt", version = "null" }
