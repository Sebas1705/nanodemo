org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# android.builtInKotlin y android.newDsl ya NO están fijados a false: se migró
# al Kotlin integrado de AGP 9 (se sacó el plugin org.jetbrains.kotlin.android,
# ver app/build.gradle.kts) y al DSL nuevo, que son los defaults de AGP 9+.

# Los flags de arriba (resvalues, defaultTargetSdkToCompileSdkIfUnset, etc.)
# los escribió el AGP Upgrade Assistant al subir de AGP 8.6.0 a 9.4.0, para
# preservar el comportamiento viejo durante la migración. Siguen generando
# warnings de "deprecated, se va en AGP 10" en cada sync — silenciados acá
# porque son ruido esperado, no errores reales.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
