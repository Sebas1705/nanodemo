name: Distribuir a Firebase App Distribution

# Vía 1 de distribución: cada push a master (o un disparo manual) compila un APK release firmado
# con el keystore fijo y lo sube a Firebase App Distribution para el grupo de testers. Todos los
# secretos viven en Doppler: en GitHub solo hace falta el secreto DOPPLER_TOKEN (ver README,
# sección "Distribución"). El build vive en la acción .github/actions/build-release-apk.
#
# versionName sigue la misma nomenclatura que las GitHub Releases (vía 2, release-apk.yml): la
# versión del último tag vX.Y.Z + un sufijo "-dev.<run>" que marca que es un build continuo, no
# una versión con tag. Antes ponía "1.0.<run_number>", un número que no salía de ningún lado del
# proyecto y no coincidía con lo que veías en GitHub Releases para el mismo commit.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribute
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Service token de Doppler, de solo lectura y limitado al proyecto+config de CI: ya lleva
      # embebido cuál usar, así que `doppler run` no necesita flags.
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe necesita el historial de tags, no solo el último commit.

      - name: Resolver la versión (último tag + este build)
        id: ver
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          BASE_VERSION="${LAST_TAG#v}"
          BASE_VERSION="${BASE_VERSION:-0.0.0}"
          echo "version_name=${BASE_VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-release-apk
        with:
          extra-secrets: FIREBASE_SERVICE_ACCOUNT_JSON
          version-name: ${{ steps.ver.outputs.version_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Subir a Firebase App Distribution
        env:
          TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
        run: |
          export NOTES="$(git log -1 --pretty='%s (%h)')"
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$TESTER_GROUP" \
              --release-notes "$NOTES"'

      - name: Borrar credenciales del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json"
