name: Distribuir a Firebase App Distribution

# Vía 1 de distribución: cada push a master (o un disparo manual) compila un APK release firmado
# con el keystore fijo y lo sube a Firebase App Distribution para el grupo de testers. Todos los
# secretos viven en Doppler: en GitHub solo hace falta el secreto DOPPLER_TOKEN (ver README,
# sección "Distribución"). El build vive en la acción .github/actions/build-release-apk.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribute
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Service token de Doppler, de solo lectura y limitado al proyecto+config de CI: ya lleva
      # embebido cuál usar, así que `doppler run` no necesita flags.
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-release-apk
        with:
          extra-secrets: FIREBASE_SERVICE_ACCOUNT_JSON

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Subir a Firebase App Distribution
        env:
          TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
        run: |
          export NOTES="$(git log -1 --pretty='%s (%h)')"
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$TESTER_GROUP" \
              --release-notes "$NOTES"'

      - name: Borrar credenciales del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json"
