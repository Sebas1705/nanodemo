name: CI

# Compila y corre los tests unitarios en cada push a main y en cada pull request. Existe aparte de
# release-apk.yml porque ese solo corre al empujar un tag: sin esto, un error de compilación se vería
# recién al publicar una versión. No usa Doppler ni ningún secreto — las keys de los tiers son opcionales
# en el build (ver `secret()` en build.gradle.kts: si faltan quedan vacías), así que también funciona
# en PRs de forks. El APK firmado de verdad lo arma release-apk.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior, que ya quedó desactualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # gradlew se commiteó sin el bit de ejecución (se creó desde Windows).
      - name: Compilar y correr los tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug testDebugUnitTest --continue "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Subir los reportes de tests si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/testDebugUnitTest"
          retention-days: 7
