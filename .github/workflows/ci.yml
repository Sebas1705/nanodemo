name: CI

# Builds the debug and release APKs and runs the unit tests on every push to main and every pull
# request. It exists apart from release-apk.yml because that one only runs when a tag is pushed:
# without this, a compile error (or an R8 shrinking problem, which only shows up in the release
# build) would be seen only when publishing a version. It uses no Doppler and no secrets: the tier
# keys are optional in the build (see `secret()` in build.gradle.kts: missing ones stay empty), so
# it also works on fork PRs. The release build is signed with the debug key here; the real signed
# APK is built by release-apk.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the previous run, which is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # gradlew was committed without the executable bit (it was created on Windows).
      - name: Build and run the tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease testDebugUnitTest --continue "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/testDebugUnitTest"
          retention-days: 7
