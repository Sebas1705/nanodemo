name: Release APK

# Única vía de distribución: al empujar un tag `vX.Y.Z` (o al disparar el workflow a mano
# indicando la versión) compila el APK release firmado y lo sube a Firebase App Distribution con
# el versionName limpio (sin sufijo "-dev").
#
# NO crea una GitHub Release ni sube el APK como artefacto: el repo es público y el APK lleva
# compiladas en BuildConfig las claves reales (Gemini, Brave, token de modelos, Firebase), así que
# cualquier copia descargable desde GitHub las expondría. Los testers lo reciben solo por Firebase.
# Antes había una segunda vía (distribute.yml) que subía un build "-dev.N" a Firebase en cada push
# a master; se sacó a propósito para no repartir builds sin tag — solo lo que se decide marcar
# como versión llega a los testers. Solo necesita Doppler (DOPPLER_TOKEN).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin prefijo, p. ej. 1.2.0 (o 1.2.0-beta.1 para pre-release)"
        required: true
        type: string

permissions:
  contents: read

# Nunca cancelar una release a medias: dos tags seguidos se encolan.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolver versión y tag
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="$GITHUB_REF_NAME"; fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versión inválida '$RAW'. Formato esperado: X.Y.Z o X.Y.Z-sufijo (p. ej. 1.2.0, 1.2.0-beta.1)"
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$EVENT" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Ya existe el tag $TAG. Elegí otra versión."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-release-apk
        with:
          version-name: ${{ steps.ver.outputs.version }}
          extra-secrets: FIREBASE_SERVICE_ACCOUNT_JSON

      - name: Subir a Firebase App Distribution
        env:
          TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          export NOTES="$TAG: $(git log -1 --pretty='%s (%h)')"
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "$TESTER_GROUP" \
              --release-notes "$NOTES"'

      - name: Borrar credenciales del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json"
