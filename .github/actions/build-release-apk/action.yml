name: Build signed release APK
description: >
  Builds `:app:assembleRelease` signed with the fixed keystore. Every secret comes from Doppler
  (the job must export DOPPLER_TOKEN and have checked out the repo first). The APK ends up in
  app/build/outputs/apk/release/app-release.apk. Only the Firebase App Distribution workflow uses it
  now: it is not published in GitHub Releases because the APK carries real keys.

inputs:
  version-name:
    description: >
      versionName of the APK (e.g. 1.2.0 or 1.2.0-dev.42). The distribution workflow always passes
      it; empty only if this action is called from elsewhere (fallback: 1.0.<run_number>).
    required: false
    default: ""
  extra-secrets:
    description: >
      Extra Doppler secrets the distribution path needs (space-separated), on top of the build and
      signing ones that are always checked.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

    - name: Check that Doppler has every secret
      shell: bash
      env:
        EXTRA_SECRETS: ${{ inputs.extra-secrets }}
      run: |
        [ -n "$DOPPLER_TOKEN" ] || { echo "::error::The DOPPLER_TOKEN secret is missing in GitHub"; exit 1; }
        doppler run -- bash -c '
          missing=0
          for name in GEMINI_API_KEY FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID \
                      MEDIAPIPE_MODEL_URL \
                      MEDIAPIPE_MODEL_URL_GEMMA_2_2B_PART1 MEDIAPIPE_MODEL_URL_GEMMA_2_2B_PART2 \
                      SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD \
                      $EXTRA_SECRETS; do
            if [ -z "${!name:-}" ]; then echo "::error::The secret $name is missing in Doppler"; missing=1; fi
          done
          exit $missing'

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

    - name: Prepare the keystore
      shell: bash
      run: |
        doppler run -- bash -c 'printf "%s" "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"'
        echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    # The tier keys arrive as environment variables (doppler run) and the build compiles them into
    # BuildConfig, so no local.properties is needed. gradlew was committed without the executable
    # bit (it was created on Windows), hence the chmod.
    - name: Build the release APK
      shell: bash
      env:
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: ${{ inputs.version-name }}
      run: |
        chmod +x gradlew
        doppler run -- ./gradlew :app:assembleRelease "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
